name: Android CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Build Android Project
      run: |
        GRADLEW_PATH=$(find . -name gradlew)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Erro: gradlew nao foi encontrado em lugar nenhum do repositorio!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Projeto encontrado na pasta: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AntiBolha-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
