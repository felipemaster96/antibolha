workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    triggering:
      events:
        - push
      branches:
        - main
    scripts:
      - name: Build APK
        run: |
          chmod +x gradlear
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
